---
version: "0.1"
runson: win

autosplit: true
concurrency: 1

env:
  TOKEN: anvdegtod-asdaasda0asda-asda
  ENVIRONMENT: staging

runtime:
  language: java
  version: "11"

cacheKey: '{{ checksum "pom.xml" }}'
cacheDirectories:
  - .m2

pre:
  - echo "ENVIRONMENT variable value is $env:ENVIRONMENT"
  - mvn -Dmaven.repo.local=./.m2 dependency:resolve

testDiscovery:
  type: raw
  mode: dynamic
  command: grep 'test name' xml/testng_win.xml | awk '{print$2}' | sed 's/name=//g' | sed 's/\x3e//g' | sed 's/\"//g'

testRunnerCommand: mvn test `-Dplatname=win `-Dmaven.repo.local=./.m2 `-DselectedTests=$test

retryOnFailure: true
maxRetries: 2

jobLabel: [selenium-testng, win, autosplit, assignment]
